name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  # One job per target, each on a runner of that architecture.
  #
  # These are native builds, not cross-compiles, and that is deliberate.
  # build.zig links the native archives by their host pantry paths (liblmdb,
  # libxml2, zstd, libpq), so passing -Dtarget hands an archive built for the
  # runner to a linker targeting something else. That does not fail the build:
  # lld warns the archive members are "neither ET_REL nor LLVM bitcode", skips
  # them, and `zig build` still exits 0 with an executable installed. Shipping
  # those would mean shipping binaries missing the code they were linked
  # against. Building on a matching runner lets pantry install the right
  # architecture's libraries and keeps the link honest.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-linux
          - runner: ubuntu-24.04-arm
            target: aarch64-linux
          - runner: macos-15-intel
            target: x86_64-macos
          - runner: macos-latest
            target: aarch64-macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.1441+d5181a9c9

      - name: Install Pantry 0.10.47
        env:
          PANTRY_VERSION: 0.10.47
        run: curl -fsSL https://pantry.dev | bash

      - name: Install locked LMDB and libxml2
        run: |
          ~/.local/bin/pantry install openldap.org/liblmdb@0.9.35
          ~/.local/bin/pantry install gnome.org/libxml2@2.13.9

      - name: Restore manifests after install
        # Installing rewrites the manifests as a side effect: naming a package
        # re-adds it to deps.yaml, and a bare install strips the Zig
        # dependencies out of build.zig.zon. The committed manifests are the
        # source of truth for what this build uses.
        run: git checkout -- deps.yaml pantry.lock package.json build.zig.zon

      - name: Build
        run: zig build -Doptimize=ReleaseFast -p zig-out/release

      - name: Package
        # Named here rather than by the release action's `auto` mode, whose
        # output changed shape between two releases of a sibling repository and
        # renamed every asset.
        run: |
          mkdir -p dist
          tar -C zig-out/release -czf "dist/zig-waf-${{ matrix.target }}.tar.gz" .
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: zig-waf-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # Publishes the Zig package to the registry and creates the GitHub release
  # once, with whatever the matrix produced.
  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show what will be attached
        # Fails loudly when the matrix produced nothing at all, rather than
        # cutting an empty release.
        run: |
          ls -l dist
          test -n "$(find dist -name '*.tar.gz' -print -quit)" || {
            echo "No archives were built; every matrix target failed." >&2
            exit 1
          }

      - uses: home-lang/pantry/packages/action@main
        with:
          publish: zig
          install: false
          release: true
          release-files: dist/*.tar.gz
          release-changelog: auto
          release-checksums: true
          token: ${{ secrets.PANTRY_TOKEN }}
          # The action falls back to GITHUB_TOKEN in the environment, which
          # GitHub does not set on its own.
          release-token: ${{ secrets.GITHUB_TOKEN }}
