# Base configuration every lab scenario starts from, loaded identically by
# zig-waf, ModSecurity and Coraza (zig-utils/zig-waf#6).
#
# It is the part of ModSecurity's modsecurity.conf-recommended that changes what
# a request costs to inspect: the engine on, request bodies buffered and parsed,
# and the body-processor selection CRS relies on. Logging is off in all three so
# no engine pays for I/O the others skip.

SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 131072
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject
SecResponseBodyAccess Off
SecAuditEngine Off

SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" \
    "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
    "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQBODY_ERROR "!@eq 0" \
    "id:200002,phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.'"
